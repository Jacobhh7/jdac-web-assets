<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- GitHub Pages 給 max-age=600，改版後容易看到舊版。這幾行讓瀏覽器少快取一點；
     真正的保險是 page code 給 iframe src 加時間戳（見 live-pagecode.js）。 -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>JDAC 直播</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,800;1,800;1,900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
.jdlive{--blue:#2563ff;--blue-deep:#1c4fd0;--ink:#0c0c0c;--paper:#f4f3ee;--card:#fff;--line:#e3e1d8;
  --muted:#6f6d64;--orange:#fa5a1e;--dark:#0a0a0a;--dark-ink:#e8eaf0;--dark-muted:#8a93a8;
  background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.jdlive *{box-sizing:border-box}
.jdlive .jd-in{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.jdlive .arch{font-family:Archivo,system-ui,sans-serif;font-style:italic;font-weight:900;letter-spacing:-.02em;line-height:.95}
.jdlive .eyebrow{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:700}
.jdlive .btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px 26px;
  font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;font-family:inherit;text-align:center}
.jdlive .btn:hover{background:var(--blue-deep)}
.jdlive .btn[disabled]{opacity:.55;cursor:default}
.jdlive .tag{display:inline-block;background:var(--orange);color:#fff;font-size:11px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px}
.jdlive .card{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink)}

/* 頁面嵌在 Wix 站裡，網站自己的 header 已經在上面了 → 不再畫自己的頂條（Jacob 2026-09-20）。
   直播中的 LIVE 標記改疊在播放器左上角，跟 YouTube/Twitch 一樣的位置，比放頂條更直接。 */
.jdlive .livedot{display:inline-flex;align-items:center;gap:7px;background:var(--orange);color:#fff;
  font-size:12px;font-weight:900;letter-spacing:.08em;padding:5px 13px;border-radius:20px}
.jdlive .livedot s{width:7px;height:7px;border-radius:50%;background:#fff;animation:jdblink 1.4s infinite}
@keyframes jdblink{0%,100%{opacity:1}50%{opacity:.25}}
.jdlive .player .livedot{position:absolute;left:12px;top:12px;z-index:3;
  box-shadow:0 2px 10px rgba(0,0,0,.45)}
/* 畫質選單：阿里雲的轉碼流是獨立播放地址、不會自動切，所以要讓觀眾自己選。
   大陸端走境外節點，卡的時候能往下降是關鍵（這正是開多碼率的理由）。 */
.jdlive .qbar{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.jdlive .qbar span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dark-muted);letter-spacing:.1em}
.jdlive .qbar button{background:#1a1d24;border:1px solid #2a2a2a;color:#cfd3dd;border-radius:8px;
  padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.jdlive .qbar button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}
.jdlive .qbar button:hover:not(.on){border-color:#3a3f4a}

.jdlive .stagewrap{background:var(--dark);padding:26px 0 30px}
.jdlive .stage2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.jdlive .player{aspect-ratio:16/9;background:#000;border:1.5px solid #2a2a2a;border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;position:relative}
.jdlive .player video{width:100%;height:100%;display:block;background:#000}
.jdlive .player .ph{color:#4a5060;font-family:"JetBrains Mono",monospace;font-size:13px;text-align:center;line-height:2;padding:20px}
.jdlive .player .ph b{display:block;font-size:40px;color:#2a3040}
.jdlive .nowtitle{margin:16px 0 0;color:#fff}
.jdlive .nowtitle h1{margin:0;font-size:clamp(26px,4.6vw,44px)}
.jdlive .nowtitle .sub{color:var(--dark-muted);font-size:15px;margin-top:8px;line-height:1.7}
.jdlive .pin{background:#10224a;border:1.5px solid var(--blue);border-radius:12px;padding:10px 13px;
  color:#cddaff;font-size:13px;font-weight:700;margin-bottom:14px}

.jdlive .chat{background:#111319;border:1.5px solid #2a2a2a;border-radius:14px;display:flex;flex-direction:column;height:520px}
.jdlive .chat h3{margin:0;padding:13px 15px;border-bottom:1px solid #23252d;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
.jdlive .chat h3 .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dark-muted);font-weight:500}
.jdlive .msgs{flex:1;overflow-y:auto;padding:12px 15px;display:flex;flex-direction:column;gap:11px}
.jdlive .msgs.blur{overflow:hidden;position:relative}
.jdlive .msgs.blur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;
  background:linear-gradient(to bottom,rgba(17,19,25,0),#111319);pointer-events:none}
.jdlive .m{font-size:13.5px;line-height:1.6;color:#cfd3dd;word-break:break-word}
.jdlive .m b{color:#fff;font-weight:800;margin-right:6px}
.jdlive .m.q{background:#2a1a10;border-left:3px solid var(--orange);padding:8px 10px;border-radius:0 8px 8px 0}
.jdlive .m.q i{font-style:normal;font-size:10px;font-weight:900;background:var(--orange);color:#fff;
  padding:1px 6px;border-radius:8px;margin-right:6px;letter-spacing:.06em}
.jdlive .m.done{background:#16220f;border-left-color:#4f9e3f}
.jdlive .m.done i{background:#4f9e3f}
.jdlive .m.mine b{color:#7fa2ff}
.jdlive .m.sys{color:var(--dark-muted);font-size:12.5px;text-align:center}
.jdlive .chatbar{border-top:1px solid #23252d;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.jdlive .chatbar textarea{width:100%;min-width:min(120px,100%);background:#0c0e13;border:1.5px solid #2a2a2a;
  border-radius:10px;color:#e8eaf0;padding:9px 11px;font:inherit;font-size:13px;resize:none}
.jdlive .chatbar .row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dark-muted)}
.jdlive .chatbar .row .btn{margin-left:auto;padding:9px 18px;font-size:14px;border-radius:10px}
.jdlive .chatbar .hint{margin:0;font-size:11.5px;color:var(--orange);min-height:1em}
.jdlive .loginwall{text-align:center;padding:16px 14px}
.jdlive .loginwall p{margin:0 0 12px;color:#cfd3dd;font-size:13px;line-height:1.7}
.jdlive .loginwall p b{color:#fff}
.jdlive .loginwall .btn{width:100%;padding:12px;font-size:15px;border-radius:10px}
.jdlive .loginwall small{display:block;margin-top:10px;color:var(--dark-muted);font-size:11.5px;line-height:1.6}

.jdlive .next{padding:clamp(40px,7vw,80px) 0}
.jdlive .nextgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,48px);align-items:center}
.jdlive .next h1{margin:14px 0 0;font-size:clamp(40px,7vw,78px)}
.jdlive .next h1 em{font-style:italic;color:var(--blue)}
.jdlive .next .zh{font-size:clamp(19px,2.4vw,26px);font-weight:900;margin:18px 0 0;line-height:1.5}
.jdlive .next p.lead{color:var(--muted);font-size:16px;line-height:1.9;margin:16px 0 0;max-width:52ch}
.jdlive .countdown{display:flex;gap:10px;margin:26px 0 0}
.jdlive .cd{background:var(--ink);color:#fff;border-radius:14px;padding:14px 8px;text-align:center;min-width:78px;flex:1;max-width:96px}
.jdlive .cd b{display:block;font-family:"JetBrains Mono",monospace;font-size:clamp(26px,4vw,36px);font-weight:700;line-height:1}
.jdlive .cd span{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;color:#8a93a8;margin-top:7px}
.jdlive .remind{padding:22px}
.jdlive .remind h3{margin:12px 0 6px;font-size:17px;font-weight:900}
.jdlive .remind p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.7}
.jdlive .remind .btn{width:100%}
.jdlive .remind small{display:block;margin-top:10px;color:var(--muted);font-size:11.5px;line-height:1.6}
.jdlive .remind small b{color:var(--ink)}

.jdlive .lab{background:var(--dark);color:var(--dark-ink);padding:clamp(40px,6vw,72px) 0}
.jdlive .lab .secname{display:flex;align-items:baseline;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.jdlive .lab .secname .en{font-family:Archivo;font-style:italic;font-weight:900;font-size:clamp(22px,3vw,32px);color:#fff}
.jdlive .lab .secname .zh{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.2em;color:var(--blue)}
.jdlive .scope{height:42px;border:1px solid #23252d;border-radius:10px;background:#0c0e13;margin-bottom:22px;overflow:hidden}
.jdlive .scope svg{width:100%;height:100%;display:block}
.jdlive .scope polyline{fill:none;stroke:var(--blue);stroke-width:1.6;stroke-dasharray:5 7;animation:jddash 9s linear infinite}
@keyframes jddash{to{stroke-dashoffset:-260}}
.jdlive .rows{display:grid;gap:11px}
.jdlive .row2{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;
  background:#111319;border:1px solid #23252d;border-radius:12px;padding:13px 15px}
.jdlive .row2 .ch{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--blue);letter-spacing:.1em}
.jdlive .row2 .t{font-size:14.5px;font-weight:700;color:#fff}

.jdlive .who{background:var(--card);border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:clamp(36px,5vw,64px) 0}
.jdlive .whogrid{display:grid;grid-template-columns:200px 1fr;gap:clamp(20px,4vw,40px);align-items:center}
.jdlive .photo{background:#fff;border:1.5px solid var(--ink);box-shadow:9px 10px 0 var(--blue);
  padding:10px 10px 14px;transform:rotate(-1.5deg)}
.jdlive .photo .im{display:block;width:100%;height:clamp(300px,30vw,400px);
  background-size:cover;background-position:center top;background-color:#dcdcd4}
.jdlive .who h3{margin:10px 0 0;font-size:clamp(24px,3.4vw,34px)}
.jdlive .who p{color:var(--muted);font-size:15px;line-height:1.9;margin:14px 0 0;max-width:56ch}
.jdlive .cta{background:var(--blue);color:#fff;padding:clamp(40px,6vw,68px) 0;text-align:center}
.jdlive .cta h2{margin:0;font-size:clamp(28px,4.6vw,46px)}
.jdlive .cta p{margin:14px auto 26px;max-width:46ch;font-size:16px;line-height:1.8;color:#dbe4ff}
.jdlive .cta .btn{background:#fff;color:var(--blue)}
.jdlive .cta .btn:hover{background:#eef3ff}
.jdlive .boot{padding:80px 20px;text-align:center;color:var(--muted);font-size:14px}

@media(max-width:900px){
  .jdlive .stage2{grid-template-columns:minmax(0,1fr)}
  .jdlive .chat{height:420px}
  .jdlive .nextgrid{grid-template-columns:minmax(0,1fr)}
  .jdlive .whogrid{grid-template-columns:minmax(0,1fr)}
  .jdlive .photo{max-width:220px;transform:none}
}
@media(max-width:560px){
  .jdlive .row2{grid-template-columns:1fr;gap:6px}
  .jdlive .countdown .cd{min-width:0;padding:12px 4px}
}

html,body{margin:0;background:#f4f3ee}
</style>

<body>

<div class="jdlive" id="jdLiveRoot"><div class="boot">載入中…</div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   JDAC 公開直播頁 /live
   ─────────────────────────────────────────────────────────────────────────
   兩種狀態：直播中（播放器＋聊天）／未開播（下一場預告＋註冊動線）。
   往期直播**刻意不在這裡陳列**——開播過的場次一律收進學員專區的講座課程，
   「想看回放」本身就是註冊的理由（Jacob 2026-09-20 決定）。

   身分的分界（整個漏斗的核心）：
     「看」  → 走公開端點 /_functions/live?scope=public，**不需要登入**（門檻越低越好）
     「留言」→ 走 webMethod（page code 橋接），**一定要登入**＝轉換點
   元件 fetch http function 拿不到登入會員，所以留言只能走 page code 那條路。

   即時性用**輪詢**不用 Realtime：公開頁訪客數不可控，而且 Realtime 要 page code
   訂閱＋轉發 attribute，多一層會壞的東西。直播中每 5 秒抓一次，夠用了。
   ═══════════════════════════════════════════════════════════════════════════ */
function jdacLiveInit(root){
  var API='https://www.jacobdrumemory.com/_functions/';
  var $=function(s){return root.querySelector(s);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  var S=null;            // 後端回的狀態
  var hls=null;          // hls.js 實例
  var pollT=null, cdT=null, renewT=null;
  var seq=0, pending={};
  var lastKey='';        // 上次渲染的狀態指紋——一樣就不重畫（不然打字會被洗掉）
  var sending=false;
  // ⚠️ 登入狀態**不能**靠後端那支公開端點判斷：元件 fetch /_functions/ 永遠拿不到登入會員，
  //    所以 getLive 回的 guest 對這頁永遠是 true，登入了也一樣。真正的登入狀態只有 page code
  //    問得到（authentication.loggedIn()），它會寫進 jdac-auth attribute 告訴我們。
  //    沒有 page code 的環境（直接開這個 html）＝永遠當未登入，顯示登入牆，這是對的 fallback。
  var loggedIn=false;
  // 目前選的畫質（'src'＝原畫）。續約網址、切換畫質都要記得沿用它，
  // 不然每 25 分鐘換一次網址時會被打回原畫——大陸學員剛降下去又被拉回去。
  var quality='src';
  // 有沒有被嵌在 Wix 頁面裡。直接開 GitHub Pages 那個網址時 parent===window，
  // 代表沒有 page code 接 postMessage → 登入／留言都不會有反應，
  // 這時按鈕要老實導回官網，而不是擺一顆按了沒事發生的假按鈕。
  var EMBEDDED=(window.parent!==window);
  var SITE='https://www.jacobdrumemory.com';
  // EMBEDDED 只說明「被嵌在某個頁面裡」，不代表**有人接**。
  // iframe 放好了但 page code 沒貼（或貼錯 nickname）時，登入／留言送出去都沒人回，
  // 按鈕就會變成按了沒反應的死鈕。page code 一活著就會回訊息（ready→auth），
  // 所以「收過它任何一則訊息」就是它在的證據。
  var hasPageCode=false;

  /* ── 跟 Wix page code 溝通（postMessage）─────────────────────────────────
     這頁是 **iframe**（Wix HTML Component），不是 Custom Element——Wix 的
     Custom Element 名額已經被 dashboard 用掉了，只能走 iframe。
     iframe 是 sandbox，拿不到 Wix 會員身分，也碰不到頁面上其他元素，
     唯一的管道就是 postMessage：
       我們 → page code：window.parent.postMessage(msg, PARENT_ORIGIN)
       page code → 我們：window.onmessage（page code 那邊呼叫 $w('#el').postMessage）
     ⚠️ targetOrigin **不可以用 '*'**——Wix 文件明講那樣訊息會被惡意網站攔截。
     沒有 page code 的環境（直接開這個 html 預覽）會逾時回 null，介面顯示登入牆，
     這是對的 fallback。 */
  var PARENT_ORIGIN='https://www.jacobdrumemory.com';
  function toParent(msg){
    try{ if(window.parent&&window.parent!==window) window.parent.postMessage(msg,PARENT_ORIGIN); }catch(e){}
  }
  window.addEventListener('message',function(ev){
    // 只收自家 page code 的訊息：Wix 的 iframe 裡什麼廣告腳本都可能發訊息進來
    if(!ev||!ev.data||typeof ev.data!=='object'||ev.data.__jdac!=='live') return;
    var d=ev.data;
    hasPageCode=true;
    if(d.kind==='result'){
      var fn=pending[d.id]; if(fn){ delete pending[d.id]; fn(d.result); }
    } else if(d.kind==='auth'){
      var was=loggedIn; loggedIn=!!d.loggedIn; if(was!==loggedIn) render(true);
    }
  });
  function action(type,payload,ms){
    return new Promise(function(res){
      var id='q'+(++seq), done=false;
      var settle=function(v){ if(done)return; done=true; delete pending[id]; res(v); };
      pending[id]=settle;
      toParent({__jdac:'live',kind:'action',type:type,id:id,payload:payload||{}});
      setTimeout(function(){ settle(null); }, ms||12000);
    });
  }
  // 回報高度給 page code（iframe 高度是固定的，內容換了要通知外層調整，
  // 不然直播中／未開播兩種版面差很多，一定有一種會被切掉或留一大片空白）
  var lastH=0;
  function reportHeight(){
    try{
      var h=Math.ceil(document.documentElement.scrollHeight);
      if(h&&Math.abs(h-lastH)>24){ lastH=h; toParent({__jdac:'live',kind:'height',height:h}); }
    }catch(e){}
  }
  setInterval(reportHeight,1200);

  /* ── 取狀態 ───────────────────────────────────────────────────────────── */
  function load(){
    return fetch(API+'live?scope=public&cb='+Date.now())
      .then(function(r){return r.json();})
      .catch(function(){return null;});
  }

  /* ── HLS ──────────────────────────────────────────────────────────────── */
  function ensureHls(){
    if(window.Hls) return Promise.resolve(true);
    return new Promise(function(res){
      var s=document.getElementById('jdac-hlsjs');
      if(!s){
        s=document.createElement('script'); s.id='jdac-hlsjs';
        s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5/dist/hls.min.js';
        document.head.appendChild(s);
      }
      s.addEventListener('load',function(){res(!!window.Hls);});
      s.addEventListener('error',function(){res(false);});
      setTimeout(function(){res(!!window.Hls);},8000);
    });
  }
  function killHls(){ try{ if(hls){hls.destroy(); hls=null;} }catch(e){ hls=null; } }
  function attach(video,url){
    killHls();
    if(video.canPlayType&&video.canPlayType('application/vnd.apple.mpegurl')){ video.src=url; return; }
    ensureHls().then(function(ok){
      if(!video.isConnected) return;
      if(ok&&window.Hls&&window.Hls.isSupported()){
        var h=new window.Hls({lowLatencyMode:true,liveSyncDurationCount:3});
        hls=h;
        // 鑑權過期（403）表現成致命載入錯誤 → 重抓一組新網址接上去
        h.on(window.Hls.Events.ERROR,function(_e,d){ if(d&&d.fatal) renew(true); });
        h.loadSource(url); h.attachMedia(video);
      } else { video.src=url; }
    });
  }
  // 目前畫質對應的網址；找不到就退回原畫（例如某個轉碼規格被關掉了）
  function urlFor(st){
    if(!st) return '';
    var q=(st.qualities||[]).filter(function(x){return x.key===quality;})[0];
    return (q&&q.url)||st.playUrl||'';
  }
  function renew(force){
    load().then(function(r){
      if(!r||!r.playUrl) return;
      S=r;
      var v=$('#jdPlayer');
      if(!v) return;
      var u=urlFor(r);
      if(force||!hls){ attach(v,u); }
      else { try{ hls.loadSource(u); }catch(e){ attach(v,u); } }
    });
  }

  /* ── 小工具 ───────────────────────────────────────────────────────────── */
  function fmtWhen(iso){
    if(!iso) return '';
    try{
      var d=new Date(iso), w='日一二三四五六'[d.getDay()];
      return d.getMonth()+1+'/'+d.getDate()+'（'+w+'）'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }catch(e){ return ''; }
  }
  // 「本場重點」＝場次說明每行一條（老師排場次時填在說明欄）
  function bullets(desc){
    return String(desc||'').split('\n').map(function(x){return x.trim();}).filter(Boolean).slice(0,6);
  }

  /* ── 渲染 ─────────────────────────────────────────────────────────────── */
  function msgHTML(m){
    var cls='m'+(m.q?' q':'')+(m.answered?' done':'')+(m.mine?' mine':'');
    return '<div class="'+cls+'" data-mid="'+esc(m.id)+'">'
      +(m.q?'<i>'+(m.answered?'已回答':'提問')+'</i>':'')
      +'<b>'+esc(m.name)+'</b>'+esc(m.text)+'</div>';
  }
  function chatBar(){
    if(!S.canChat) return '<div class="chatbar"><p class="hint" style="color:#8a93a8">這一場沒有開放留言。</p></div>';
    if(!loggedIn){
      if(!EMBEDDED){
        // 直接開這個網址（它只是 iframe 的內容來源，不是給人看的）→ 帶去官網那一頁
        return '<div class="chatbar loginwall">'
          +'<p><b>想留言或提問？</b><br>請到官網的直播頁，登入後就能發言。</p>'
          +'<a class="btn" href="'+SITE+'/live" target="_top">到官網直播頁</a></div>';
      }
      if(!hasPageCode){
        // 嵌在頁面裡但沒人接（page code 沒貼／沒發佈）。這裡**刻意不給按鈕**：
        // 站上沒有獨立的登入網址（Wix 的登入是彈窗，只有 page code 開得起來），
        // 導去哪都是原地打轉，那比沒有按鈕更糟。
        return '<div class="chatbar loginwall">'
          +'<p><b>留言功能設定中</b><br>很快就開放，先看直播吧。</p></div>';
      }
      return '<div class="chatbar loginwall">'
        +'<p><b>想留言或提問？</b><br>免費註冊會員就能發言，Jacob 會挑題現場回答。</p>'
        +'<button class="btn" id="jdLogin">登入 / 免費註冊</button>'
        +'<small>已經是學員的話，用原本的帳號登入就好。</small></div>';
    }
    return '<div class="chatbar">'
      +'<textarea id="jdText" rows="2" maxlength="300" placeholder="說點什麼，或勾「這是問題」讓 Jacob 看到"></textarea>'
      +'<div class="row"><label><input type="checkbox" id="jdIsQ"> 這是問題</label>'
      +'<button class="btn" id="jdSend">送出</button></div>'
      +'<p class="hint" id="jdHint"></p></div>';
  }
  function ctaHTML(){
    return '<div class="cta"><div class="jd-in">'
      +'<h2 class="arch">想把今天講的真的練起來？</h2>'
      +'<p>直播講的是「為什麼」，線上教練課帶你走完「怎麼做」——有課表、有作業，我一個一個批改。</p>'
      +'<a class="btn" href="'+SITE+'/onlinecoaching" target="_top">看線上教練課</a>'
      +'</div></div>';
  }

  function viewLive(){
    var s=S.session, bs=bullets(s.desc);
    var msgs=(S.messages||[]).map(msgHTML).join('')
      || '<div class="m sys">還沒有人發言。打個招呼吧。</div>';
    return '<div class="stagewrap"><div class="jd-in">'
      + (s.pinnedText?'<div class="pin">📌 '+esc(s.pinnedText)+'</div>':'')
      +'<div class="stage2"><div>'
      +'<div class="player"><span class="livedot"><s></s>LIVE</span>'+(S.playUrl
          ? '<video id="jdPlayer" controls playsinline autoplay muted></video>'
          : '<div class="ph"><b>▶</b>直播準備中，稍後重新整理</div>')+'</div>'
      + ((S.qualities&&S.qualities.length>1&&S.playUrl)
          ? '<div class="qbar"><span>畫質</span>'+S.qualities.map(function(q){
              return '<button data-q="'+esc(q.key)+'"'+(q.key===quality?' class="on"':'')+'>'+esc(q.label)+'</button>';
            }).join('')+'</div>'
          : '')
      +'<div class="nowtitle"><h1 class="arch">'+esc(s.title)+'</h1></div>'
      +'</div>'
      +'<div class="chat"><h3>💬 聊天室<span class="n" id="jdCnt">'+((S.messages||[]).length)+' 則</span></h3>'
      +'<div class="msgs'+(loggedIn?'':' blur')+'" id="jdMsgs">'+msgs+'</div>'
      +chatBar()+'</div>'
      +'</div></div></div>'
      + (bs.length?('<div class="lab"><div class="jd-in">'
          +'<div class="secname"><span class="en">TONIGHT\'S SET</span><span class="zh">本場重點</span></div>'
          +'<div class="scope"><svg viewBox="0 0 600 42" preserveAspectRatio="none"><polyline points="0,21 40,21 52,7 64,35 76,21 130,21 142,12 154,30 166,21 240,21 252,4 264,38 276,21 340,21 352,14 364,28 376,21 450,21 462,8 474,34 486,21 600,21"/></svg></div>'
          +'<div class="rows">'+bs.map(function(b,i){
              return '<div class="row2"><span class="ch">CH.'+String(i+1).padStart(2,'0')+'</span><span class="t">'+esc(b)+'</span></div>';
            }).join('')+'</div></div></div>'):'')
      + ctaHTML();
  }

  function viewIdle(){
    var s=S.session;
    var when=s?fmtWhen(s.scheduledAt):'';
    var bs=s?bullets(s.desc):[];
    var head=s
      ? '<span class="eyebrow">NEXT SESSION / 下一場直播</span>'
        +'<h1 class="arch">'+esc(s.title)+'</h1>'
        +'<p class="zh">'+esc(when)+' · 免費 · 線上</p>'
        + (bs.length?'<p class="lead">'+esc(bs.join('｜'))+'</p>':'')
        +'<div class="countdown" id="jdCd"><div class="cd"><b>--</b><span>DAYS</span></div>'
        +'<div class="cd"><b>--</b><span>HRS</span></div><div class="cd"><b>--</b><span>MIN</span></div></div>'
      : '<span class="eyebrow">JDAC LIVE</span>'
        +'<h1 class="arch">下一場<br><em>還在排</em></h1>'
        +'<p class="lead">每一場挑一個大家真的卡住的點，講清楚、當場示範、當場回答。排好會公告，註冊會員就會收到通知。</p>';
    return '<div class="next"><div class="jd-in"><div class="nextgrid"><div>'+head+'</div>'
      +'<div class="card remind"><span class="tag">Free</span>'
      +'<h3>'+(loggedIn?'開播時會通知你':'註冊就通知你開播')+'</h3>'
      +'<p>'+(loggedIn
          ?'你已經登入了，開播時會通知你。直播時可以直接留言提問。'
          :(EMBEDDED&&!hasPageCode
            ?'註冊功能設定中，很快開放。'
            :'免費註冊會員，開播前寄提醒給你。直播時也才能留言、提問——Jacob 會挑題現場回答。'))+'</p>'
      +(loggedIn?''
         :((EMBEDDED&&hasPageCode)?'<button class="btn" id="jdLogin">免費註冊 / 登入</button>'
           :(EMBEDDED?''   /* 嵌了但沒人接＝按鈕開不了彈窗，不如不放 */
                     :'<a class="btn" href="'+SITE+'/live" target="_top">到官網直播頁</a>')))
      +'<small>往期的直播不會放在這裡，開播過的場次會收進<b>學員專區的講座課程</b>。</small>'
      +'</div></div></div></div>'
      +'<div class="who"><div class="jd-in"><div class="whogrid">'
      +'<div class="photo"><span class="im" style="background-image:url(\'https://static.wixstatic.com/media/1a91b2_1e92d8180af344d9964f182bc39876ef~mv2.jpg/v1/fill/w_680,h_820,al_c,q_85,enc_auto/jacob.jpg\')"></span></div><div>'
      +'<span class="eyebrow">MEET JACOB / 關於你的教練</span>'
      +'<h3 class="arch">教鼓十幾年，<br>最常看到的還是同一批問題</h3>'
      +'<p>所以我開這個直播。每一場挑一個大家真的卡住的點，講清楚、當場示範、當場回答。不賣關子，也不留一半到課程裡。</p>'
      +'</div></div></div></div>'
      + ctaHTML();
  }

  /* ── 主渲染：狀態指紋一樣就不重畫（避免洗掉打到一半的留言）────────────── */
  function key(){
    if(!S) return 'boot';
    var s=S.session;
    return [S.live?'L':'I', s?s.id:'-', s?s.status:'-', loggedIn?'m':'g', S.canChat?'c':'-',
            s?s.pinnedText:'', S.playUrl?'p':'-'].join('|');
  }
  function render(force){
    var k=key();
    if(!force && k===lastKey){ patchMsgs(); return; }
    lastKey=k;
    root.innerHTML = S ? (S.live?viewLive():viewIdle()) : '<div class="boot">載入中…</div>';
    wire();
    setTimeout(reportHeight,60);
  }
  // 只換訊息區，不動輸入框
  function patchMsgs(){
    var box=$('#jdMsgs'); if(!box||!S) return;
    var html=(S.messages||[]).map(msgHTML).join('')||'<div class="m sys">還沒有人發言。打個招呼吧。</div>';
    if(box.getAttribute('data-sig')===html) return;
    var near=box.scrollHeight-box.scrollTop-box.clientHeight<60;
    box.setAttribute('data-sig',html);
    box.innerHTML=html;
    var c=$('#jdCnt'); if(c) c.textContent=((S.messages||[]).length)+' 則';
    if(near) box.scrollTop=box.scrollHeight;
  }

  /* ── 接線 ─────────────────────────────────────────────────────────────── */
  function wire(){
    root.querySelectorAll('[data-q]').forEach(function(b){
      b.addEventListener('click',function(){
        if(b.dataset.q===quality) return;
        quality=b.dataset.q;
        root.querySelectorAll('[data-q]').forEach(function(x){ x.classList.toggle('on',x.dataset.q===quality); });
        var vv=$('#jdPlayer');
        if(vv) attach(vv,urlFor(S));   // 換源會小卡一下，這是切畫質的正常行為
      });
    });
    var v=$('#jdPlayer');
    if(v&&S&&S.playUrl){
      attach(v,urlFor(S));
      if(renewT) clearTimeout(renewT);
      renewT=setTimeout(function(){renew(false);}, Math.max(60,Number(S.renewInSec)||1500)*1000);
    }
    var box=$('#jdMsgs'); if(box) box.scrollTop=box.scrollHeight;

    var lg=$('#jdLogin');
    if(lg) lg.addEventListener('click',function(){
      lg.disabled=true;
      action('prompt-login',{},60000).then(function(r){
        lg.disabled=false;
        // 登入成功 → 重抓狀態（guest 會變 false，輸入框就出現了）
        if(r&&r.ok){ loggedIn=true; refresh(true); }
        else if(r===null){ lg.textContent='請到 jacobdrumemory.com 登入'; }
      });
    });

    var send=$('#jdSend'), ta=$('#jdText');
    if(send&&ta){
      var go=function(){
        if(sending) return;
        var text=(ta.value||'').trim();
        var hint=$('#jdHint');
        if(!text||!S.session) return;
        sending=true; send.disabled=true; if(hint) hint.textContent='';
        var q=$('#jdIsQ');
        action('live-msg',{sessionId:S.session.id,text:text,isQuestion:!!(q&&q.checked)}).then(function(r){
          sending=false; send.disabled=false;
          if(r&&r.ok){
            ta.value=''; if(q) q.checked=false;
            S.messages=(S.messages||[]).concat([r.msg]);
            patchMsgs();
          } else if(hint){
            hint.textContent = !r ? '沒送出去，再試一次。'
              : r.reason==='too-fast' ? '慢一點，兩秒後再送。'
              : r.reason==='login-required' ? '請先登入。'
              : r.reason==='chat-off' ? '留言已關閉。' : '沒送出去，再試一次。';
          }
        });
      };
      send.addEventListener('click',go);
      ta.addEventListener('keydown',function(e){
        if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();go();}
      });
    }
    startCountdown();
  }

  function startCountdown(){
    if(cdT){clearInterval(cdT);cdT=null;}
    var el=$('#jdCd'); if(!el||!S||!S.session||!S.session.scheduledAt) return;
    var target=new Date(S.session.scheduledAt).getTime();
    var tick=function(){
      var d=target-Date.now();
      if(d<=0){ el.innerHTML='<div class="cd" style="max-width:none"><b style="font-size:20px">即將開始</b></div>'; clearInterval(cdT); cdT=null; return; }
      var day=Math.floor(d/864e5), hr=Math.floor(d%864e5/36e5), mi=Math.floor(d%36e5/6e4);
      var b=el.querySelectorAll('b');
      if(b.length>=3){ b[0].textContent=String(day).padStart(2,'0'); b[1].textContent=String(hr).padStart(2,'0'); b[2].textContent=String(mi).padStart(2,'0'); }
    };
    tick(); cdT=setInterval(tick,30000);
  }

  /* ── 輪詢：直播中 5 秒（聊天要跟得上），沒播 60 秒（只是等開播）────────── */
  function refresh(force){
    return load().then(function(r){
      if(!r) return;
      S=r; render(force);
      schedule();
    });
  }
  function schedule(){
    if(pollT) clearTimeout(pollT);
    pollT=setTimeout(function(){refresh(false);}, (S&&S.live)?5000:60000);
  }

  // 跟 page code 握手：iframe 什麼時候載完，外層是不知道的。
  // 由我們主動說一聲「我好了」，page code 收到才推登入狀態過來，
  // 比它定時盲推可靠（它那邊仍留了幾次重推當保險）。
  toParent({__jdac:'live',kind:'ready'});
  // page code 活著的話這時候早就回過話了。還沒回＝它不在，重畫一次把按鈕換成真連結。
  setTimeout(function(){ if(!hasPageCode) render(true); }, 3500);
  refresh(true);
}
jdacLiveInit(document.getElementById('jdLiveRoot'));
</script>
</body>
</html>
