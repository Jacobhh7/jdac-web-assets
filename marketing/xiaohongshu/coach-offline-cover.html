<!doctype html>
<meta charset="utf-8">
<title>JDAC 實體課 · 小紅書封面</title>
<style>
  /* ── 小紅書直式封面 3:4（1242×1656）──
     色票沿用 jdac-coachpage.js：米白 #f4f3ee / 墨 #0c0c0c / 藍 #2563ff / 橘 #fa5a1e
     要換梯次資訊只改 .foot 那三行就好。 */
  @page { size: 1242px 1656px; margin: 0 }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { width: 1242px; height: 1656px; background: #f4f3ee; color: #0c0c0c;
         font-family: "Noto Sans TC", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden }
  .card { width: 100%; height: 100%; padding: 78px 76px 74px; display: flex; flex-direction: column }

  .lab { font-family: "Archivo", sans-serif; font-weight: 700; letter-spacing: .30em;
         text-transform: uppercase; font-size: 19px }

  /* 頂列 */
  .top { display: flex; justify-content: space-between; align-items: flex-end;
         border-bottom: 3px solid #0c0c0c; padding-bottom: 20px }
  .mark { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 46px; letter-spacing: .02em; line-height: 1 }
  .mark span { color: #fa5a1e }
  .sub { font-family: "Archivo", sans-serif; font-weight: 700; letter-spacing: .22em;
         font-size: 14px; color: #6b675f; margin-top: 9px }
  .badge { display: flex; align-items: center; gap: 12px; color: #2563ff }
  .badge i { width: 13px; height: 13px; background: #fa5a1e; border-radius: 50%; display: block }

  /* 主標 */
  h1 { margin-top: 58px; font-weight: 900; font-size: 112px; line-height: 1.24; letter-spacing: -.015em }
  h1 .b { color: #2563ff }
  h1 .u { background: linear-gradient(transparent 62%, #fa5a1e 62%, #fa5a1e 92%, transparent 92%) }
  .deck { margin-top: 34px; font-size: 34px; line-height: 1.7; color: #45423c; font-weight: 500 }

  /* 照片 */
  figure { margin-top: 44px; position: relative; border-radius: 26px; overflow: hidden;
           height: 566px; background: #ddd }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block }
  figcaption { position: absolute; left: 26px; bottom: 24px; background: rgba(12,12,12,.82); color: #fff;
               font-size: 25px; font-weight: 700; padding: 13px 24px; border-radius: 999px; letter-spacing: .02em }

  /* 三個關鍵字 */
  .keys { margin-top: 40px; display: flex; gap: 14px }
  .keys div { flex: 1; border: 3px solid #0c0c0c; border-radius: 16px; text-align: center;
              padding: 20px 0 22px; font-weight: 900; font-size: 40px; letter-spacing: .04em }

  /* 底 CTA */
  .foot { margin-top: auto; padding-top: 34px; border-top: 3px solid #0c0c0c;
          display: flex; justify-content: space-between; align-items: flex-end; gap: 24px }
  .foot .l { font-size: 31px; line-height: 1.55; font-weight: 700 }
  .foot .l em { font-style: normal; color: #2563ff }
  .foot .r { text-align: right; flex: none }
  .foot .r .n { font-weight: 900; font-size: 44px; line-height: 1.15; white-space: nowrap }
  .foot .r .n b { color: #fa5a1e }
</style>

<div class="card">
  <div class="top">
    <div>
      <div class="mark">JDAC<span>.</span></div>
      <div class="sub">JACOB DRUMEMORY ACADEMY</div>
    </div>
    <div class="badge lab"><i></i>一對一實體課</div>
  </div>

  <h1>你不是<span class="u">沒天分</span><br>只是沒人幫你<br>把<span class="b">手</span>調正</h1>

  <p class="deck">練三年還是那幾個節奏，通常不是不夠努力——<br>是握棒、重心、身體用力的順序，沒人在旁邊看著改。</p>

  <figure>
    <img src="hero_class.jpg" alt="Jacob 在實體課現場與學員面對面上課">
    <figcaption>面對面才看得到的那些細節</figcaption>
  </figure>

  <div class="keys">
    <div>運棒</div><div>穩定性</div><div>學習路徑</div>
  </div>

  <div class="foot">
    <div class="l">
      評論區跟我說：<em>你卡最久的是哪一關</em><br>
      想約課的，私訊我「實體課」三個字
    </div>
    <div class="r">
      <div class="n">上海 · 面對面<br><b>檔期有限</b></div>
    </div>
  </div>
</div>
