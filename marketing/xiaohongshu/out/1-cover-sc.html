<!doctype html>
<meta charset="utf-8">
<title>1 封面 (sc)</title>
<style>
/* 字重明確綁死，不靠系統去猜。粗細不一致有兩個來源，兩個都堵掉：
   1) 只用 400 / 700 / 900 三級 —— 之前混到 500（沒這個字檔）跟 900
      （Noto 的 Black 在系統裡是獨立字族），瀏覽器就自己合成假粗體。
   2) 簡體版一定要用 Noto Sans SC —— 用 TC 去排簡體，缺的字會掉到系統
      備援字型（文泉驛）去墊，同一行就會忽粗忽細。 */
@font-face { font-family:"CJK"; font-weight:400; src:url("../fonts/NotoSansSC-400.ttf") format("truetype") }
@font-face { font-family:"CJK"; font-weight:700; src:url("../fonts/NotoSansSC-700.ttf") format("truetype") }
@font-face { font-family:"CJK"; font-weight:900; src:url("../fonts/NotoSansSC-900.ttf") format("truetype") }
@font-face { font-family:"Arch"; font-weight:700; src:url("../fonts/Archivo-700.ttf") format("truetype") }
@font-face { font-family:"Arch"; font-weight:900; src:url("../fonts/Archivo-900.ttf") format("truetype") }

* { box-sizing:border-box; margin:0; padding:0 }
body { width:1242px; height:1656px; overflow:hidden; background:#f4f3ee; color:#0c0c0c;
       font-family:"CJK",sans-serif; -webkit-font-smoothing:antialiased }
.pg { width:100%; height:100%; display:flex; flex-direction:column }
.lat { font-family:"Arch",sans-serif; font-weight:700 }
/* 小標籤 */
.chip { display:inline-block; background:#fa5a1e; color:#fff; font-weight:900; font-size:30px;
        letter-spacing:.06em; padding:12px 26px; border-radius:999px }
/* 高亮：用 inline-block 壓低行高，色塊才不會撞到上一行 */
.hl { display:inline-block; background:#fa5a1e; color:#fff; line-height:1.06;
      padding:.06em .12em .10em; border-radius:8px }
.o  { color:#fa5a1e }

/* 純大字報，不放照片。靠字級落差跟橘色塊撐畫面，
   節拍格子當視覺元素，比塞一張看不清楚的照片有力。 */
.pg { padding:84px 76px 72px; justify-content:space-between }
.pg h1 { font-size:200px; font-weight:900; line-height:1.24; letter-spacing:-.035em; margin-top:44px }
.beats { display:flex; gap:13px }
.beats i { width:44px; height:44px; border-radius:10px; background:#ddd9ce; display:block }
.beats i.on { background:#fa5a1e }
.kick { font-size:42px; font-weight:700; color:#5b574f; margin-top:34px }
.foot { display:flex; justify-content:space-between; align-items:flex-end; font-size:38px;
        font-weight:700; border-top:5px solid #0c0c0c; padding-top:32px }
.foot span { color:#5b574f }
.foot b { color:#fa5a1e; font-size:46px }
</style>

<div class="pg">
  <div>
    <div class="chip">打鼓 · 卡关自救</div>
    <h1>练了3年<br>还是只会<br><span class="hl">那几个节奏</span></h1>
  </div>
  <div>
    <div class="beats"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div>
    <div class="kick">90% 的人以为是天分问题</div>
  </div>
  <div class="foot"><span>其实大家都卡在同一件事</span><b>往右滑 →</b></div>
</div>
