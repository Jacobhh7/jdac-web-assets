<!doctype html>
<meta charset="utf-8">
<title>2 解答 (tc)</title>
<style>
/* 字重明確綁死，不靠系統去猜。粗細不一致有兩個來源，兩個都堵掉：
   1) 只用 400 / 700 / 900 三級 —— 之前混到 500（沒這個字檔）跟 900
      （Noto 的 Black 在系統裡是獨立字族），瀏覽器就自己合成假粗體。
   2) 簡體版一定要用 Noto Sans SC —— 用 TC 去排簡體，缺的字會掉到系統
      備援字型（文泉驛）去墊，同一行就會忽粗忽細。 */
@font-face { font-family:"CJK"; font-weight:400; src:url("../fonts/NotoSansTC-400.ttf") format("truetype") }
@font-face { font-family:"CJK"; font-weight:700; src:url("../fonts/NotoSansTC-700.ttf") format("truetype") }
@font-face { font-family:"CJK"; font-weight:900; src:url("../fonts/NotoSansTC-900.ttf") format("truetype") }
@font-face { font-family:"Arch"; font-weight:700; src:url("../fonts/Archivo-700.ttf") format("truetype") }
@font-face { font-family:"Arch"; font-weight:900; src:url("../fonts/Archivo-900.ttf") format("truetype") }

* { box-sizing:border-box; margin:0; padding:0 }
body { width:1242px; height:1656px; overflow:hidden; background:#f4f3ee; color:#0c0c0c;
       font-family:"CJK",sans-serif; -webkit-font-smoothing:antialiased }
.pg { width:100%; height:100%; display:flex; flex-direction:column }
.lat { font-family:"Arch",sans-serif; font-weight:700 }
/* 小標籤 */
.chip { display:inline-block; background:#fa5a1e; color:#fff; font-weight:900; font-size:30px;
        letter-spacing:.06em; padding:12px 26px; border-radius:999px }
/* 高亮：用 inline-block 壓低行高，色塊才不會撞到上一行 */
.hl { display:inline-block; background:#fa5a1e; color:#fff; line-height:1.06;
      padding:.06em .12em .10em; border-radius:8px }
.o  { color:#fa5a1e }

.pg { padding:80px 76px 70px; justify-content:space-between }
.pg h1 { font-size:92px; font-weight:900; line-height:1.28; letter-spacing:-.025em; margin-top:36px }
.list { display:flex; flex-direction:column; gap:40px }
.row { display:flex; align-items:flex-start; gap:26px }
.row .n { font-family:"Arch",sans-serif; font-weight:900; font-size:52px; color:#fa5a1e;
          line-height:1.12; flex:none; width:86px }
.row .t { font-size:46px; font-weight:700; line-height:1.34 }
.note { font-size:34px; line-height:1.62; color:#3f3c36; font-weight:700;
        border-left:9px solid #2563ff; padding-left:28px }
.cta { background:#0c0c0c; color:#fff; border-radius:24px; padding:48px 48px;
       font-size:66px; font-weight:900; line-height:1.32; letter-spacing:-.015em }
</style>

<div class="pg">
  <div>
    <div class="chip">為什麼越練越卡</div>
    <h1>不是你不夠努力<br>是沒人在旁邊看著改</h1>
  </div>
  <div class="list"><div class="row"><div class="n">01</div><div class="t">握棒的支點，到底在哪根手指</div></div><div class="row"><div class="n">02</div><div class="t">棒子落下去，是彈回來還是被你硬拉回來</div></div><div class="row"><div class="n">03</div><div class="t">打快的時候，是手在動還是手臂在硬撐</div></div></div>
  <div class="note">這三件事，隔著螢幕看不到。我坐你旁邊十分鐘，能省你半年。</div>
  <div class="cta">我人已經在<span class="o">上海</span><br>一對一，面對面上課中</div>
</div>
