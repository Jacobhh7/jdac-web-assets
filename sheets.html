<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>JDAC 練習講義</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,800;1,900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
html,body{margin:0;background:#f4f3ee}
body{color:#0c0c0c;font-family:"Noto Sans TC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(18px,5vw,40px) 48px}
.mono{font-family:"JetBrains Mono",monospace}
.mglab{font-family:"Archivo",sans-serif;font-weight:500;letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#2563ff;margin:30px 0 10px}
h1{font-family:"Archivo","Noto Sans TC",sans-serif;font-style:italic;font-weight:900;font-size:clamp(27px,5.6vw,40px);line-height:1.14;letter-spacing:-.015em;margin:0 0 12px}
h1 em{font-style:italic;color:#2563ff}
.sub{font-size:clamp(14.5px,1.5vw,16px);color:#3a3a36;line-height:1.8;margin:0 0 26px}
.sub b{color:#0c0c0c;border-bottom:2px solid #fa5a1e;font-weight:700}
.fine{font-size:13px;color:#8a8579;line-height:1.75;margin:0}
/* 講義卡 */
.ixgrid{display:grid;gap:18px}
.ixgrid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.ix{background:#fff;border:1.5px solid #0c0c0c;border-radius:16px;box-shadow:6px 7px 0 #0c0c0c;overflow:hidden;display:flex;flex-direction:column}
.ix .th{display:block;line-height:0}
.ix img{width:100%;display:block;border-bottom:1.5px solid #0c0c0c;background:#f4f3ee;aspect-ratio:1/.5;object-fit:cover;object-position:top center}
.ixb{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.ixno{align-self:flex-start;font-family:"Archivo",sans-serif;font-weight:800;font-size:11px;letter-spacing:.14em;background:#2563ff;color:#fff;padding:3px 10px;border-radius:99px}
.ixt{font-weight:900;font-size:18px;margin:10px 0 6px;line-height:1.4}
.ixp{font-size:14px;line-height:1.75;color:#2c2c28;margin:0 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.b{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:900;font-size:14px;padding:10px 16px;border-radius:99px;border:1.5px solid #0c0c0c;background:#fff;color:#0c0c0c;box-shadow:3px 4px 0 #0c0c0c;transition:transform .12s}
.b:active{transform:translateY(2px)}
.b.p{background:#2563ff;color:#fff;border-color:#2563ff}
.b .m{font-family:"Archivo",sans-serif;font-weight:900;font-size:11px;background:#0c0c0c;color:#fff;width:19px;height:19px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.ixm{font-size:12.5px;color:#8a8579;margin:14px 0 0;border-top:1px dashed rgba(12,12,12,.14);padding-top:9px}
/* 留 email */
.qz-em{margin:26px 0 0;padding:20px 22px;background:#fff;border:1.5px solid #0c0c0c;border-radius:16px;box-shadow:6px 7px 0 #2563ff}
.qzt{font-weight:900;font-size:16.5px}
.qz-emrow{display:flex;gap:10px;margin:12px 0 0}
@media(max-width:619px){.qz-emrow{flex-direction:column}}
.qz-emin{width:100%;min-width:min(240px,100%);flex:1;font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid #0c0c0c;border-radius:10px;background:#fff}
.qz-embtn{font-family:"Noto Sans TC",sans-serif;font-weight:900;font-size:15px;padding:12px 22px;border:1.5px solid #0c0c0c;border-radius:10px;background:#fff;cursor:pointer;white-space:nowrap}
.qz-emmsg{font-size:13.5px;margin:10px 0 0;min-height:1em}
.qz-emmsg.ok{color:#1c7a3e}.qz-emmsg.err{color:#c0392b}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.reveal.in-view{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

</style>
</head>
<body>
<div class="wrap">
<p class="mglab">JDAC 練習講義</p>
<h1>每一支免費教學，<em>都配一份可以印出來的譜</em></h1>
<p class="sub">A4，印出來夾在譜架上就能用。<b>直接下載，不用留 email。</b></p>

<div class="ixgrid">
  <div class="ix reveal">
    <a class="th" href="sheets/paradiddle-to-chops.pdf" download><img src="sheets/paradiddle-to-chops-p1.png" alt="Paradiddle to Chops 練習譜"></a>
    <div class="ixb">
      <span class="ixno">SHEET 01</span>
      <div class="ixt">Paradiddle to Chops</div>
      <p class="ixp">用 double stroke ＋ paradiddle 組出一句聽起來很難的 chops，全程沒用到大鼓雙擊。</p>
      <div class="btns"><a class="b p" href="sheets/paradiddle-to-chops.pdf" download>下載譜（3 頁）</a><a class="b" href="https://www.youtube.com/watch?v=_mACUNdc_MI" target="_blank" rel="noopener"><span class="m">▶</span>YouTube</a><a class="b" href="https://www.bilibili.com/video/BV1xatU6XE9M/" target="_blank" rel="noopener"><span class="m">B</span>B站</a></div>
      <p class="ixm mono">3 頁 ・ 配套影片 8:57</p>
    </div>
  </div></div>

<div class="qz-em">
  <div class="qzt">出新的講義要不要寄給你？</div>
  <p class="fine" style="margin-top:6px">留個信箱，之後每出一份我一起寄。只寄講義，不寄別的，隨時可以退訂。</p>
  <form id="subf"><div class="qz-emrow">
    <input class="qz-emin" id="em" type="email" required placeholder="你的 email">
    <button class="qz-embtn" type="submit">寄給我</button>
  </div></form>
  <p class="qz-emmsg" id="msg"></p>
</div>

<p class="fine" style="margin-top:22px">自己練、印出來、帶去教室都可以。請不要拿去賣，也不要改成自己的名字。</p>
</div>
<script>
(function () {
  var API = 'https://www.jacobdrumemory.com/_functions';
  var $ = function (i) { return document.getElementById(i); };
  $('subf').addEventListener('submit', function (e) {
    e.preventDefault();
    var m = $('msg'); m.className = 'qz-emmsg'; m.textContent = '寄送中…';
    var src = (new URLSearchParams(location.search).get('src') || 'sheets')
      .toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 20);
    fetch(API + '/handoutLead', { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ email: $('em').value.trim(), handout: 'all', source: src }) })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function () { m.className = 'qz-emmsg ok'; m.textContent = '好了，之後出新的我就寄給你。'; })
      .catch(function () { m.className = 'qz-emmsg err'; m.textContent = '寄不出去。上面的譜還是可以直接下載。'; });
  });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (x) {
      if (x.isIntersecting) { x.target.classList.add('in-view'); io.unobserve(x.target); } }); }, { threshold: .12 });
    document.querySelectorAll('.reveal').forEach(function (n) { io.observe(n); });
  } else { document.querySelectorAll('.reveal').forEach(function (n) { n.classList.add('in-view'); }); }
  function rh() { if (window.parent === window) return;
    try { window.parent.postMessage({ jdacHeight: Math.ceil(document.documentElement.scrollHeight), jdacFrom: 'sheets' }, '*'); } catch (e) {} }
  window.addEventListener('load', rh); window.addEventListener('resize', rh);
  [0, 300, 800, 1500, 2500].forEach(function (ms) { setTimeout(rh, ms); });
})();
</script>
</body>
</html>
