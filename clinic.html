<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>一對一影片診斷｜JDAC 爵士鼓學校</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,800;1,800;1,900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
html,body{margin:0;background:#f4f3ee}
body{color:#0c0c0c;font-family:"Noto Sans TC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:720px;margin:0 auto;padding:0 clamp(18px,5vw,40px) 56px}
.mglab{font-family:"Archivo",sans-serif;font-weight:500;letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#2563ff;margin:30px 0 10px}
h1{font-family:"Archivo","Noto Sans TC",sans-serif;font-style:italic;font-weight:900;font-size:clamp(28px,6.6vw,42px);line-height:1.14;letter-spacing:-.015em;margin:0 0 14px}
h1 em{font-style:italic;color:#2563ff}
.sub{font-size:clamp(14.5px,1.5vw,16px);color:#3a3a36;line-height:1.85;margin:0 0 24px}
.sub b{color:#0c0c0c;border-bottom:2px solid #fa5a1e;font-weight:700}
.card{background:#fff;border:1.5px solid #0c0c0c;border-radius:18px;box-shadow:8px 9px 0 #0c0c0c;padding:clamp(22px,3vw,36px);margin-bottom:22px}
.dh{font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;color:#2563ff;margin:0 0 14px;text-transform:uppercase}
.steps{margin:0 0 4px;padding:0;list-style:none}
.steps li{font-size:15px;line-height:1.85;padding:11px 0 11px 40px;position:relative;border-bottom:1px dashed rgba(12,12,12,.12);color:#2c2c28}
.steps li:last-child{border-bottom:0}
.steps li::before{content:attr(data-n);position:absolute;left:0;top:11px;width:26px;height:26px;background:#2563ff;color:#fff;border-radius:50%;font-family:"Archivo",sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps b{border-bottom:2px solid #fa5a1e}
.note{font-size:14px;line-height:1.9;color:#2c2c28;background:#f7f5ec;border-left:4px solid #fa5a1e;padding:14px 18px;border-radius:0 8px 8px 0;margin:18px 0 0}
.dl{display:inline-block;font-family:"Archivo",sans-serif;font-weight:800;font-size:12px;letter-spacing:.12em;background:#0c0c0c;color:#f4f3ee;padding:5px 14px;border-radius:99px;margin-bottom:14px}
.dl.warn{background:#fa5a1e}
label.fl{display:block;font-weight:700;font-size:14.5px;margin:0 0 8px}
.hint{font-size:13px;color:#8a8579;margin:0 0 14px;line-height:1.7}
input[type=file],textarea{width:100%;min-width:min(260px,100%);font-family:"Noto Sans TC",sans-serif;font-size:15px;border:1.5px solid #0c0c0c;border-radius:12px;padding:13px 14px;background:#f7f5ec;color:#0c0c0c}
textarea{min-height:110px;resize:vertical;line-height:1.75}
input[type=file]{padding:11px 12px}
.fld{margin-bottom:20px}
.jh-btn{font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:15.5px;padding:15px 26px;border:1.5px solid #0c0c0c;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s,background .14s;background:#fff;color:#0c0c0c;width:100%}
.jh-btn.p{background:#2563ff;color:#fff;border-color:#2563ff}
.jh-btn.p:hover:not(:disabled){background:#1f56e0;transform:translate(-2px,-2px)}
.jh-btn:disabled{opacity:.5;cursor:not-allowed}
.bar{height:10px;background:rgba(12,12,12,.1);border-radius:99px;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;width:0;background:#2563ff;transition:width .25s ease}
.pct{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;color:#3a3a36;text-align:center}
.msg{font-size:14.5px;line-height:1.8;padding:13px 16px;border-radius:12px;margin-top:14px;font-weight:600}
.msg.err{background:#fdecec;color:#9b1c1c;border:1.5px solid #f3b4b4}
.msg.ok{background:#e9f6ee;color:#12633a;border:1.5px solid #a9ddbf}
.big{font-family:"Archivo","Noto Sans TC",sans-serif;font-style:italic;font-weight:900;font-size:clamp(24px,4.2vw,34px);line-height:1.15;margin:0 0 12px}
.ctr{text-align:center;padding:14px 0}
.ctr .em{font-size:44px;line-height:1;margin-bottom:14px}
footer{max-width:720px;margin:0 auto;padding:18px clamp(18px,5vw,40px) 40px;border-top:1.5px solid rgba(12,12,12,.15);font-size:12.5px;color:#8a8579;line-height:1.8}
footer a{color:#2563ff;text-decoration:none;font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="mglab">JDAC · One-on-one Video Clinic</div>
  <h1>你打一段，<em>我親自看</em>。</h1>
  <p class="sub" id="lead">正在確認你的邀請連結……</p>
  <div id="stage"></div>
</div>
<footer>JDAC 爵士鼓學校 · 這是一對一邀請連結，請不要轉發。有問題直接回信給我就好。</footer>

<script>
(function () {
  var API = 'https://www.jacobdrumemory.com/_functions';
  var MAX_MB = 500;
  var TOKEN = (new URLSearchParams(location.search).get('t') || '').toLowerCase().replace(/[^a-f0-9]/g, '').slice(0, 20);
  var stage = document.getElementById('stage');
  var lead = document.getElementById('lead');
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };

  // 嵌在 Wix 的 iframe 裡時，把自己的高度回報給母頁（masterPage 會據此調整元件高度）。
  // 不在 iframe 裡（獨立開頁）就什麼都不做。
  function reportHeight() {
    if (window.parent === window) return;
    try {
      var h = Math.ceil(document.documentElement.scrollHeight);
      window.parent.postMessage({ jdacHeight: h, jdacFrom: 'clinic' }, '*');
    } catch (e) { /* 跨域被擋就算了，母頁會用預設高度 */ }
  }
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  // 母頁（Wix masterPage）可能比 iframe 晚掛上 onMessage，早送的那則會掉。
  // 開頭幾秒多送幾次，任何一則接到就會調好高度；都沒接到就維持編輯器設的固定高度。
  [0, 300, 800, 1500, 2500, 4000].forEach(function (ms) { setTimeout(reportHeight, ms); });

  function panel(html) {
    stage.innerHTML = '<div class="card">' + html + '</div>';
    setTimeout(reportHeight, 30);   // 內容換了，高度也要跟著回報
  }

  function bad(title, body) {
    lead.textContent = '';
    panel('<div class="ctr"><div class="em">🤔</div><div class="big">' + esc(title) + '</div>'
        + '<p class="sub" style="margin:0">' + body + '</p></div>');
  }

  if (!TOKEN) {
    bad('這個連結不完整', '請直接點我寄給你的信件裡那條連結（網址結尾要有一串英數字）。用複製貼上的話，記得整條都要貼到。');
    return;
  }

  fetch(API + '/clinic?t=' + encodeURIComponent(TOKEN))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) {
        bad('這條連結我認不得', '可能是網址少貼了一小段，或這次的名額不包含這個信箱。直接回信給我，我幫你看一下。');
        return;
      }
      if (d.submitted) { done(true); return; }
      if (d.over) {
        bad('這次的收件已經截止了', '截止日是 ' + esc(d.deadline) + '。如果你還是想讓我看一下，回信跟我說，我看看能不能排進去。');
        return;
      }
      render(d);
    })
    .catch(function () {
      bad('連線出了點問題', '請稍後重新整理一次。一直不行的話直接回信給我。');
    });

  function render(d) {
    lead.innerHTML = '這是給 <b>' + esc(d.emailMask) + '</b> 的專屬連結。傳一支 30 秒的影片上來，我會親自看完、個別回覆你。';
    setTimeout(reportHeight, 30);
    var warn = '';
    var dl = new Date(d.deadline + 'T23:59:59+08:00');
    var days = Math.ceil((dl - Date.now()) / 86400000);
    if (days <= 3) warn = ' warn';
    panel(
      '<span class="dl' + warn + '">收件截止 ' + esc(d.deadline) + (days > 0 ? '（剩 ' + days + ' 天）' : '') + '</span>'
      + '<div class="dh">拍什麼</div>'
      + '<ul class="steps">'
      + '<li data-n="1">節拍器設 <b>80</b>，只響第 <b>2、4 拍</b>（很多手機 app 都可以設）。</li>'
      + '<li data-n="2">跟著打一段<b>最基本的 8 beat</b>，大概 30 秒就夠。</li>'
      + '<li data-n="3">手機隨便放，<b>拍得到手和腳</b>就好。不用打得好，打你平常的樣子。</li>'
      + '</ul>'
      + '<div class="note">如果你有更想讓我看的東西（某首歌卡住的地方、某個過門），那就拍那個，不用勉強照上面來。<b>我要看的是你真實的樣子，不是你最好的一次。</b></div>'
      + '<div style="height:26px"></div>'
      + '<div class="dh">傳上來</div>'
      + '<div class="fld"><label class="fl" for="f">你的影片</label>'
      + '<p class="hint">手機直接選相簿裡的檔就好。上限 ' + MAX_MB + 'MB（30 秒的影片遠遠不會超過）。</p>'
      + '<input type="file" id="f" accept="video/*,audio/*"></div>'
      + '<div class="fld"><label class="fl" for="n">你最想問我什麼？</label>'
      + '<p class="hint">寫一兩句就好——你自己覺得哪裡怪、或想知道什麼。這會決定我回覆時先講哪一件事。</p>'
      + '<textarea id="n" maxlength="1000" placeholder="例：我打久了會越來越快，但自己聽不太出來是從哪裡開始跑的。"></textarea></div>'
      + '<button class="jh-btn p" id="go">傳給 Jacob</button>'
      + '<div class="bar hide" id="bar"><i></i></div><div class="pct hide" id="pct"></div>'
      + '<div class="msg hide" id="msg"></div>'
    );
    wire();
  }

  function wire() {
    var f = document.getElementById('f'), n = document.getElementById('n'), go = document.getElementById('go');
    var bar = document.getElementById('bar'), pct = document.getElementById('pct'), msg = document.getElementById('msg');
    function say(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; }
    function fail(text) { say('err', text); go.disabled = false; go.textContent = '再試一次'; bar.classList.add('hide'); pct.classList.add('hide'); }

    go.addEventListener('click', function () {
      var file = f.files && f.files[0];
      if (!file) { say('err', '先選一支影片再送出喔。'); return; }
      if (file.size > MAX_MB * 1024 * 1024) { say('err', '這支超過 ' + MAX_MB + 'MB 了。拍短一點，或用手機的「壓縮後傳送」再試一次。'); return; }
      go.disabled = true; go.textContent = '上傳中…';
      msg.className = 'msg hide'; bar.classList.remove('hide'); pct.classList.remove('hide');
      pct.textContent = '準備中…';

      fetch(API + '/clinicSign', {
        method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ token: TOKEN, fileName: file.name, fileSize: file.size, contentType: file.type || '' }),
      }).then(function (r) { return r.json(); }).then(function (s) {
        if (!s || !s.ok) {
          if (s && s.reason === 'closed') { fail('收件已經截止了。想補傳的話回信跟我說。'); return; }
          if (s && s.reason === 'too-big') { fail('檔案太大了，請拍短一點再試。'); return; }
          fail('準備上傳的時候出了問題，請再試一次。'); return;
        }
        // OSS PostObject：file 一定要放最後一個欄位
        var fd = new FormData();
        Object.keys(s.fields).forEach(function (k) { fd.append(k, s.fields[k]); });
        fd.append('file', file);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', s.host, true);
        xhr.upload.onprogress = function (e) {
          if (!e.lengthComputable) return;
          var p = Math.round(e.loaded / e.total * 100);
          bar.querySelector('i').style.width = p + '%';
          pct.textContent = p + '%';
        };
        xhr.onload = function () {
          if (xhr.status !== 204 && xhr.status !== 200) { fail('上傳失敗（' + xhr.status + '）。換個網路再試一次看看。'); return; }
          pct.textContent = '收檔中…';
          fetch(API + '/clinicRecord', {
            method: 'POST', headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ token: TOKEN, key: s.key, note: n.value || '', fileName: file.name, fileSize: file.size }),
          }).then(function (r) { return r.json(); }).then(function (d2) {
            if (d2 && d2.ok) { done(false); }
            else { fail('影片傳上去了，但通知我的時候出了問題。麻煩回信跟我說一聲，我去撈檔案。'); }
          }).catch(function () {
            fail('影片傳上去了，但通知我的時候出了問題。麻煩回信跟我說一聲，我去撈檔案。');
          });
        };
        xhr.onerror = function () { fail('上傳中斷了。換個網路（建議用 Wi-Fi）再試一次。'); };
        xhr.send(fd);
      }).catch(function () { fail('連線出了問題，請稍後再試一次。'); });
    });
  }

  function done(already) {
    lead.textContent = '';
    panel('<div class="ctr"><div class="em">🥁</div>'
      + '<div class="big">' + (already ? '你已經傳過了' : '收到了！') + '</div>'
      + '<p class="sub" style="margin:0 0 6px">'
      + (already
          ? '這支影片我已經收到，正在排隊等我看。回覆會直接寄到你的信箱。'
          : '我會親自看完你這一段，然後<b>寄一封回覆到你的信箱</b>——講我看到什麼、你現在最該修的是哪一件事。')
      + '</p>'
      + '<p class="hint" style="margin:14px 0 0">通常 2～3 天內會回。如果超過一週還沒收到，直接回信催我。</p></div>');
  }
})();
</script>
</body>
</html>
